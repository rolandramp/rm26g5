[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-framework"
version = "0.1.0"
description = "Parametrizable RAG Evaluation Framework"
authors = [
    {name = "Research Methods 2026 Group 5"}
]
dependencies = [
    "langchain==1.2.15",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.16",
    "chromadb==1.5.8",
    "ragas==0.4.3",
    "pyyaml==6.0.3",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "rank-bm25==0.2.1",
    "openai==2.32.0",
    "tiktoken==0.12.0",
    "nltk==3.9.4",
    "datasets==4.8.4",
    "fastapi==0.115.0",
    "uvicorn==0.30.0"
]

[project.scripts]
rag-eval = "rag_framework.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}