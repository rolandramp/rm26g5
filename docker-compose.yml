services:
  ollama-backend:
    build:
      context: ./dockerimage/ollama
      dockerfile: Dockerfile
    container_name: ollama-llm
    environment:
      - OLLAMA_MODEL=ministral-3:3b
      - OLLAMA_EMBED_MODELS=nomic-embed-text,mxbai-embed-large,bge-m3
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 32G
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "6543:11434"
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep ministral-3:3b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s
  llama-cpp-backend:
    profiles: ["gpu"]
    build:
      context: dockerimage/llama-cpp
      dockerfile: Dockerfile
    container_name: llama-cpp-llm
    restart: unless-stopped
    ports:
      - "1235:8080"
    networks:
      - rag-network
    # GPU: Reserve/enable GPUs for this service.
    # comment out if you want to run on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    # Persistent volume for downloaded models: map to the image cache dir used by llama.cpp
    volumes:
      - llamacpp_models:/root/.cache/llama.cpp
    environment:
      - HF_HOME=/root/.cache/llama.cpp
    # Pass only the server networking arguments; model selection now comes from app-side config.
    command: ["-hf", "mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M", "--port", "8080", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  rag-framework:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-framework
    environment:
      - OLLAMA_BASE_URL=http://ollama-backend:11434
      - OPENAI_API_KEY=ollama
      - CONFIG_PATH=config/experiment_config_docker.yaml
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./cache:/app/cache
      - ./chroma_db:/app/chroma_db
      - ./results:/app/results
    ports:
      - "8000:8000"
    networks:
      - rag-network
    depends_on:
      ollama-backend:
        condition: service_healthy
      llama-cpp-backend:
        condition: service_healthy

networks:
  rag-network:
    driver: bridge

volumes:
  ollama_data:
  llamacpp_models: