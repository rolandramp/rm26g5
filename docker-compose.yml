services:
  ollama-backend:
    build:
      context: ./dockerimage/ollama
      dockerfile: Dockerfile
    container_name: ollama-llm
    environment:
      - OLLAMA_MODEL=ministral-3:3b
      - OLLAMA_EMBED_MODELS=nomic-embed-text,mxbai-embed-large,bge-m3
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "6543:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep ministral-3:3b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

volumes:
  ollama_data: