# Sample experiment configuration
ingestion:
  loader_type: directory
  path: ./data

chunking:
  strategy: recursive
  chunk_size: 1000
  chunk_overlap: 200

embedding:
  model_type: openai
  model_name: text-embedding-ada-002
  api_key: ${OPENAI_API_KEY}
  base_url: null  # For compatible providers

vector_store:
  store_type: chroma
  persist_directory: ./chroma_db

retriever:
  k: 5

generator:
  model_name: gpt-3.5-turbo
  api_key: ${OPENAI_API_KEY}
  base_url: null

evaluation:
  # Config for custom metrics

ground_truth_path: ./data/ground_truth.json