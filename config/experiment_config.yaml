# Sample experiment configuration
ingestion:
  dataset: rag-datasets/rag-mini-bioasq
  dataset_qna_config: question-answer-passages
  dataset_corpus_config: text-corpus
  dataset_cache_dir: ./cache/datasets

chunking:
  strategy: recursive
  chunk_size: 1000
  chunk_overlap: 200

embedding:
  model_type: openai
  model_name: text-embedding-ada-002
  api_key: ${OPENAI_API_KEY}
  base_url: null  # For compatible providers

# Optional embedding profiles (e.g. for Ollama).
# If `active_embedding_profile` matches a key below, that profile overrides `embedding`.
active_embedding_profile: nomic-embed-text
embedding_profiles:
  nomic-embed-text:
    model_type: openai
    model_name: nomic-embed-text
    api_key: ollama
    base_url: http://localhost:6543/v1
  mxbai-embed-large:
    model_type: openai
    model_name: mxbai-embed-large
    api_key: ollama
    base_url: http://localhost:6543/v1
  bge-m3:
    model_type: openai
    model_name: bge-m3
    api_key: ollama
    base_url: http://localhost:6543/v1

vector_store:
  store_type: chroma
  persist_directory: ./chroma_db

retriever:
  k: 5

generator:
  model_name: gpt-3.5-turbo
  api_key: ${OPENAI_API_KEY}
  base_url: null

evaluation:
  # Config for custom metrics
