# Experiment configuration for running locally with Docker containers
# Docker containers expose ports to localhost:
# - Ollama: localhost:6543 (maps to container port 11434)
# - llama-cpp: localhost:1235 (maps to container port 8080)

ingestion:
  dataset: rag-datasets/rag-mini-bioasq
  dataset_qna_config: question-answer-passages
  dataset_corpus_config: text-corpus
  dataset_cache_dir: ./cache/datasets

active_chunking_profile: medium
chunking_profiles:
  small:
    strategy: recursive
    chunk_size: 500
    chunk_overlap: 100
  medium:
    strategy: recursive
    chunk_size: 1000
    chunk_overlap: 200
  large:
    strategy: recursive
    chunk_size: 2000
    chunk_overlap: 400

active_embedding_profile: nomic-embed-text
embedding_profiles:
  nomic-embed-text:
    model_type: openai
    model_name: nomic-embed-text
    api_key: ollama
    base_url: http://localhost:6543/v1
  mxbai-embed-large:
    model_type: openai
    model_name: mxbai-embed-large
    api_key: ollama
    base_url: http://localhost:6543/v1
  bge-m3:
    model_type: openai
    model_name: bge-m3
    api_key: ollama
    base_url: http://localhost:6543/v1

vector_store:
  store_type: chroma
  persist_directory: ./chroma_db

retriever:
  k: 5

active_generator_profile: mistral-3-3b-gguf
generator_profiles:
  mistral-3-3b-gguf:
    model_name: mistralai/Ministral-3-3B-Instruct-2512-GGUF:Q4_K_M
    api_key: not-needed
    base_url: http://localhost:1235/v1
  ministral-3:3b:
    model_name: ministral-3:3b
    api_key: ollama
    base_url: http://localhost:6543/v1
  #gpt-3.5-turbo:
  #  model_name: openai/gpt-3.5-turbo
  #  api_key: add your-api-key
  #  base_url: https://openrouter.ai/api/v1/

evaluation:
  # Config for custom metrics

workload:
  max_chunks: 200
  max_questions: 10